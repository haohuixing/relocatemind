{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
  
  <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl shadow-black/60 relative overflow-hidden">
    
    <div class="mb-6">
      <h1 class="text-2xl font-extrabold text-slate-100 tracking-tight">
        {{ t('auth.login_title') }}
      </h1>
      <p class="text-xs text-slate-400 mt-1">
        {{ t('auth.login_subtitle') }}
      </p>
    </div>

    {% if success_message %}
      <div class="mb-6 p-3.5 bg-emerald-950/80 border border-emerald-800/80 rounded-xl text-emerald-300 text-xs flex items-center gap-2">
        <span>✅</span>
        <span>{{ success_message }}</span>
      </div>
    {% endif %}

    {% if error %}
      <div class="mb-6 p-3.5 bg-rose-950/80 border border-rose-800/80 rounded-xl text-rose-300 text-xs flex items-center gap-2">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">
          {{ t('auth.email_label') }}
        </label>
        <input type="email" name="email" placeholder="{{ t('auth.email_placeholder') }}" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-4 py-3 text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">
          {{ t('auth.password_label') }}
        </label>
        <input type="password" name="password" placeholder="{{ t('auth.password_placeholder') }}" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-4 py-3 text-sm placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-sky-500/25 transition-all mt-2">
        {{ t('auth.btn_login') }}
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
      {{ t('auth.dont_have_account') }} <a href="/register" class="text-sky-400 hover:text-sky-300 font-semibold transition-colors">{{ t('nav.register') }}</a>
    </p>
  </div>

</div>
{% endblock %}
